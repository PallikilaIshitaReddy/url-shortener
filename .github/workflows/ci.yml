name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

services:
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: url_shortener
    ports: [ "5432:5432" ]
    options: >-1
      --health-cmd pg_isready
      --health-interval 5s
      --health-timeout 5s
      --health-retries 5
  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]
    options: >-1
      --health-cmd "redis-cli ping"
      --health-interval 5s
      --health-timeout 5s
      --health-retries 5

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server deps and run tests
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/url_shortener
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
        run: |
          npm ci
          if [ -f ../db/schema.sql ]; then psql "$DATABASE_URL" -f ../db/schema.sql; fi
          npm test
      - name: Install client deps and build
        working-directory: client
        run: |
          npm ci
          npm run build
